plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    // kotlin-android-extensions 제거: Kotlin 1.8+ 에서 제거된 플러그인.
    // (synthetics/@Parcelize 미사용 확인 → 코드 변경 없이 제거 가능)
    id 'maven-publish'
}

android {
    // AGP 8 : package 대신 namespace
    namespace 'net.common.commonlib'
    compileSdk 35

    defaultConfig {
        minSdk 21
        // 라이브러리 모듈의 targetSdk 는 AGP 8 에서 deprecated 이므로 제거
        versionCode 200
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        dataBinding true
    }

    // AGP 8 publishing : 노출할 variant 를 명시해야 from components.release 가 동작
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'net.common.commonlib'
                artifactId = 'commonlib'
                // 최신 스택(AGP8/SDK35) 변경은 소비자 compileSdk 요구가 바뀌는 breaking change → 메이저 2.0.0
                // (기존 앱은 1.0.16 태그를 계속 사용하므로 영향 없음)
                version = '2.0.0'
            }
        }
    }
}

dependencies {

    // androidx 는 compileSdk 35 호환 버전으로 상향(webviewlib 와 동일)
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'

    // Glide 는 Kotlin 1.9 kapt 와의 안정성을 위해 최신(4.16.0)으로 상향, compiler 는 kapt 로 처리
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.google.code.gson:gson:2.10.1'
}

task deleteObjectJar(type: Delete) {
    delete 'release/commonlib.jar'
}

// release 폴더에 library 이름으로 jar 생성.
task exportJar(type: Copy) {
    from('build/intermediates/aar_main_jar/release/')
    into('release/')
    include('classes.jar')
    rename('classes.jar', 'commonlib.jar')
}

exportJar.dependsOn(deleteObjectJar, build)
