plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    // kotlin-android-extensions 제거: Kotlin 1.8+ 에서 제거된 플러그인.
    // (synthetics/@Parcelize 미사용 확인 → 코드 변경 없이 제거 가능)
    id 'maven-publish'
}

android {
    // AGP 8 : package 대신 namespace
    namespace 'net.common.commonlib'
    compileSdk 35

    defaultConfig {
        minSdk 21
        // 라이브러리 모듈의 targetSdk 는 AGP 8 에서 deprecated 이므로 제거
        versionCode 200
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        dataBinding true
    }

    // AGP 8 publishing : 노출할 variant 를 명시해야 from components.release 가 동작
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'net.common.commonlib'
                artifactId = 'commonlib'
                // 2.0.1 까지 배포됨 → 미사용 의존성(retrofit/okhttp/gson) 제거 반영분이 2.0.2
                // (jitpack 태그 불변: 변경 시 항상 +1)
                version = '2.0.2'
            }
        }
    }
}

dependencies {

    // androidx 는 compileSdk 35 호환 버전으로 상향(webviewlib 와 동일)
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // material 자체는 미사용이라 제거. 단 BaseTitlebar 가 쓰는 ConstraintLayout 은
    // 기존에 material 의 transitive 로 들어오던 것이라, 명시적으로 추가한다.
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // 네트워크(retrofit/okhttp)·gson 은 commonlib 에서 사용하지 않아 제거함.
    // 네트워크가 필요한 앱은 각자 의존성을 직접 추가할 것.

    // Glide 는 ImageViewExtension 에서 사용. compiler 는 kapt 로 처리.
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
}

task deleteObjectJar(type: Delete) {
    delete 'release/commonlib.jar'
}

// release 폴더에 library 이름으로 jar 생성.
task exportJar(type: Copy) {
    from('build/intermediates/aar_main_jar/release/')
    into('release/')
    include('classes.jar')
    rename('classes.jar', 'commonlib.jar')
}

exportJar.dependsOn(deleteObjectJar, build)
